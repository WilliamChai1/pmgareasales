name: Sync PMG House Brands from Jase Healthcare

on:
  schedule:
    # Run every Monday at 00:00 UTC (8:00 AM MYT)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run House Brands Sync Script
        run: node scripts/sync_house_brands.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/house_brands_catalog.json data/house_brands.js
          if git diff --staged --quiet; then
            echo "No new products or updates detected. House brand catalog is already up to date."
          else
            git commit -m "chore(catalog): auto-sync house brand products from Jase Healthcare"
            git push origin main
          fi
